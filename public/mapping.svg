<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 220" width="320" height="220">
  <!-- Real Card Background -->
  <rect width="320" height="220" fill="#faf8f5" rx="8"/>
  
  <!-- Lined notebook background lines -->
  <line x1="0" y1="35" x2="320" y2="35" stroke="rgba(100, 150, 250, 0.2)" stroke-width="1"/>
  <line x1="0" y1="70" x2="320" y2="70" stroke="rgba(100, 150, 250, 0.2)" stroke-width="1"/>
  <line x1="0" y1="105" x2="320" y2="105" stroke="rgba(100, 150, 250, 0.2)" stroke-width="1"/>
  <line x1="0" y1="140" x2="320" y2="140" stroke="rgba(100, 150, 250, 0.2)" stroke-width="1"/>
  <line x1="0" y1="175" x2="320" y2="175" stroke="rgba(100, 150, 250, 0.2)" stroke-width="1"/>

  <!-- Real Hand-Drawn Card Box -->
  <rect x="55" y="55" width="220" height="125" fill="#ffffff" stroke="#2b2b2b" stroke-width="2" rx="10"/>

  <!-- 🔵 BLUE REGION: CARD BACKGROUND (Semi-transparent Blue) -->
  <rect x="56" y="56" width="218" height="123" fill="rgba(59, 130, 246, 0.35)" rx="9"/>

  <!-- 🔴 RED REGION: TIME TEXT 07:00 (Semi-transparent Red Circle/Box) -->
  <rect x="65" y="70" width="75" height="28" fill="rgba(239, 68, 68, 0.45)" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="75" y="90" font-family="'Caveat', cursive, sans-serif" font-size="20" font-weight="700" fill="#2b2b2b">07:00</text>

  <!-- 🟡 YELLOW REGION: ACTIVITY TITLE Uyanış (Semi-transparent Yellow) -->
  <rect x="65" y="108" width="95" height="35" fill="rgba(234, 179, 8, 0.6)" stroke="#ca8a04" stroke-width="1.5" rx="6"/>
  <text x="73" y="133" font-family="'Caveat', cursive, sans-serif" font-size="24" font-weight="700" fill="#2b2b2b">Uyanış</text>

  <!-- 🟠 ORANGE REGION: CHECKBOX (Semi-transparent Orange) -->
  <rect x="220" y="65" width="20" height="20" fill="rgba(249, 115, 22, 0.65)" stroke="#ea580c" stroke-width="1.5" rx="4"/>

  <!-- 🟣 PURPLE REGION: TRASH CAN BUTTON (Semi-transparent Purple) -->
  <circle cx="260" cy="75" r="14" fill="rgba(168, 85, 247, 0.65)" stroke="#9333ea" stroke-width="1.5"/>
  <path d="M255 71 h10 M257 71 v8 M263 71 v8" stroke="#ffffff" stroke-width="1.5"/>
</svg>
