<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;display=swap');
      .notebook-text { font-family: 'Caveat', cursive, sans-serif; font-size: 26px; font-weight: 700; fill: #2b2b2b; }
      .sub-text { font-family: 'Caveat', cursive, sans-serif; font-size: 20px; font-weight: 700; fill: #4b5563; }
      .badge-text { font-family: sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Lined Paper Background -->
  <rect width="500" height="240" fill="#faf8f5" rx="12"/>
  <line x1="0" y1="40" x2="500" y2="40" stroke="rgba(100, 150, 250, 0.25)" stroke-width="1.5"/>
  <line x1="0" y1="80" x2="500" y2="80" stroke="rgba(100, 150, 250, 0.25)" stroke-width="1.5"/>
  <line x1="0" y1="120" x2="500" y2="120" stroke="rgba(100, 150, 250, 0.25)" stroke-width="1.5"/>
  <line x1="0" y1="160" x2="500" y2="160" stroke="rgba(100, 150, 250, 0.25)" stroke-width="1.5"/>
  <line x1="0" y1="200" x2="500" y2="200" stroke="rgba(100, 150, 250, 0.25)" stroke-width="1.5"/>

  <!-- Card Frame -->
  <rect x="50" y="30" width="400" height="170" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5" rx="12" filter="drop-shadow(2px 3px 0px rgba(0,0,0,0.15))"/>

  <!-- 🔵 BLUE REGION: CARD BACKGROUND / BODY (Semi-transparent Blue) -->
  <rect x="52" y="32" width="396" height="166" fill="rgba(59, 130, 246, 0.22)" rx="10"/>

  <!-- 🔴 RED REGION: TIME BADGE (05:04) (Semi-transparent Red) -->
  <rect x="68" y="46" width="110" height="34" fill="rgba(239, 68, 68, 0.35)" stroke="#ef4444" stroke-width="1.5" rx="6"/>
  <text x="80" y="70" className="sub-text" fill="#ef4444">🕒 05:04</text>

  <!-- 🟡 YELLOW REGION: ACTIVITY TITLE (Test) (Semi-transparent Yellow) -->
  <rect x="68" y="100" width="140" height="42" fill="rgba(234, 179, 8, 0.45)" stroke="#eab308" stroke-width="1.5" rx="6"/>
  <text x="80" y="130" className="notebook-text">Test</text>

  <!-- 🟠 ORANGE REGION: CHECKBOX (Semi-transparent Orange) -->
  <rect x="360" y="46" width="28" height="28" fill="rgba(249, 115, 22, 0.45)" stroke="#f97316" stroke-width="2" rx="4"/>

  <!-- 🟣 PURPLE REGION: TRASH CAN BUTTON (Semi-transparent Purple) -->
  <circle cx="414" cy="60" r="16" fill="rgba(168, 85, 247, 0.45)" stroke="#a855f7" stroke-width="2"/>
  <path d="M408 55 h12 M411 55 v10 M417 55 v10" stroke="#a855f7" stroke-width="1.5"/>

  <!-- REGION ANNOTATION BADGES -->
  <rect x="185" y="50" width="115" height="22" fill="#ef4444" rx="4"/>
  <text x="190" y="65" className="badge-text">🔴 Saat Menüsü</text>

  <rect x="215" y="110" width="115" height="22" fill="#d97706" rx="4"/>
  <text x="220" y="125" className="badge-text">🟡 İsim Düzenleme</text>

  <rect x="250" y="165" width="125" height="22" fill="#2563eb" rx="4"/>
  <text x="255" y="180" className="badge-text">🔵 Detay Penceresi</text>

  <rect x="320" y="18" width="80" height="20" fill="#ea580c" rx="4"/>
  <text x="325" y="32" className="badge-text">🟠 Tik Kutusu</text>

  <circle cx="414" cy="20" r="10" fill="#9333ea"/>
  <text x="410" y="24" className="badge-text" font-size="10">🟣</text>
</svg>
